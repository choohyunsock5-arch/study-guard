<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공부해 임마 - 스마트폰 중독 탈출 AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --bg2: #12121a;
    --bg3: #1a1a26;
    --accent: #ff3b3b;
    --accent2: #ff6b35;
    --accent3: #ffd60a;
    --text: #f0f0f0;
    --text2: #a0a0b0;
    --border: rgba(255,255,255,0.08);
    --card: rgba(255,255,255,0.04);
    --glow: 0 0 30px rgba(255,59,59,0.3);
  }

  html, body {
    height: 100%;
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }

  /* ========== SCREENS ========== */
  .screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  .screen.hidden {
    opacity: 0;
    pointer-events: none;
    transform: translateY(20px);
  }

  /* ========== BACKGROUND EFFECTS ========== */
  .bg-grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,59,59,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,59,59,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .bg-glow {
    position: fixed;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(255,59,59,0.08) 0%, transparent 70%);
    top: -200px;
    right: -200px;
    pointer-events: none;
    z-index: 0;
    animation: floatGlow 8s ease-in-out infinite;
  }

  .bg-glow2 {
    position: fixed;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(255,107,53,0.06) 0%, transparent 70%);
    bottom: -100px;
    left: -100px;
    pointer-events: none;
    z-index: 0;
    animation: floatGlow 10s ease-in-out infinite reverse;
  }

  @keyframes floatGlow {
    0%, 100% { transform: translate(0,0); }
    50% { transform: translate(20px, -20px); }
  }

  /* ========== INTRO SCREEN ========== */
  #introScreen {
    z-index: 10;
    padding: 2rem;
    text-align: center;
  }

  .intro-badge {
    display: inline-block;
    background: rgba(255,59,59,0.15);
    border: 1px solid rgba(255,59,59,0.4);
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 3px;
    padding: 6px 16px;
    border-radius: 20px;
    text-transform: uppercase;
    margin-bottom: 1.5rem;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,59,59,0.4); }
    50% { box-shadow: 0 0 0 8px rgba(255,59,59,0); }
  }

  .intro-title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(3.5rem, 10vw, 6rem);
    line-height: 1;
    margin-bottom: 0.5rem;
    background: linear-gradient(135deg, #fff 0%, #ff3b3b 50%, #ff6b35 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .intro-sub {
    font-size: 1.1rem;
    color: var(--text2);
    margin-bottom: 3rem;
    letter-spacing: 1px;
  }

  .intro-form {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2rem;
    width: 100%;
    max-width: 420px;
    backdrop-filter: blur(10px);
  }

  .form-title {
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 1.5rem;
    color: var(--text);
    text-align: left;
  }

  .form-group {
    margin-bottom: 1.2rem;
    text-align: left;
  }

  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--text2);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .form-group input, .form-group select {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .form-group input:focus, .form-group select:focus {
    border-color: rgba(255,59,59,0.5);
    box-shadow: 0 0 0 3px rgba(255,59,59,0.1);
  }

  .form-group select option {
    background: #1a1a26;
  }

  .grades-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.8rem;
    margin-top: 0.5rem;
  }

  .grade-item label {
    font-size: 11px;
    color: var(--text2);
    margin-bottom: 4px;
    display: block;
  }

  .grade-item input {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .grade-item input:focus {
    border-color: rgba(255,59,59,0.5);
  }

  .btn-start {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 12px;
    color: white;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 1.2rem;
    cursor: pointer;
    margin-top: 1rem;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 20px rgba(255,59,59,0.4);
  }

  .btn-start:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 30px rgba(255,59,59,0.5);
  }

  .btn-start:active { transform: scale(0.98); }

  /* ========== MAIN SCREEN ========== */
  #mainScreen {
    z-index: 10;
    flex-direction: column;
    height: 100%;
    padding: 0;
    justify-content: flex-start;
    overflow: hidden;
  }

  /* Header */
  .header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: rgba(10,10,15,0.9);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(10px);
    flex-shrink: 0;
    z-index: 20;
  }

  .header-logo {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 1.1rem;
    background: linear-gradient(135deg, #fff, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .header-info {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .status-badge {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .header-btns {
    display: flex;
    gap: 6px;
  }

  .icon-btn {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
    color: var(--text2);
    font-size: 13px;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .icon-btn:hover {
    background: rgba(255,59,59,0.1);
    border-color: rgba(255,59,59,0.3);
    color: var(--accent);
  }

  /* Chat area */
  .chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  .chat-container::-webkit-scrollbar {
    width: 4px;
  }
  .chat-container::-webkit-scrollbar-track { background: transparent; }
  .chat-container::-webkit-scrollbar-thumb {
    background: rgba(255,59,59,0.3);
    border-radius: 2px;
  }

  /* Messages */
  .msg {
    display: flex;
    gap: 12px;
    max-width: 85%;
    animation: msgIn 0.3s ease;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    flex-direction: row-reverse;
    align-self: flex-end;
  }

  .msg-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    align-self: flex-end;
  }

  .msg-avatar.ai {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    font-size: 14px;
    font-family: 'Black Han Sans', sans-serif;
  }

  .msg-avatar.user {
    background: rgba(255,255,255,0.1);
    border: 1px solid var(--border);
    font-size: 14px;
  }

  .msg-bubble {
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
  }

  .msg.ai .msg-bubble {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }

  .msg.ai.angry .msg-bubble {
    background: rgba(255,40,40,0.08);
    border-color: rgba(255,59,59,0.3);
  }

  .msg.user .msg-bubble {
    background: rgba(255,59,59,0.15);
    border: 1px solid rgba(255,59,59,0.3);
    border-bottom-right-radius: 4px;
    color: var(--text);
  }

  /* Typing indicator */
  .typing-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: typing 1.2s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* Input area */
  .input-area {
    padding: 12px 20px;
    background: rgba(10,10,15,0.9);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
    backdrop-filter: blur(10px);
  }

  .chat-input {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 16px;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    outline: none;
    resize: none;
    max-height: 120px;
    overflow-y: auto;
    transition: border-color 0.2s;
  }

  .chat-input:focus {
    border-color: rgba(255,59,59,0.4);
  }

  .chat-input::placeholder { color: var(--text2); }

  .send-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 10px;
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 16px;
    transition: transform 0.2s, box-shadow 0.2s;
    flex-shrink: 0;
  }

  .send-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 15px rgba(255,59,59,0.4);
  }

  /* User info bar */
  .user-info-bar {
    background: rgba(255,59,59,0.05);
    border-bottom: 1px solid rgba(255,59,59,0.1);
    padding: 8px 20px;
    display: flex;
    gap: 16px;
    align-items: center;
    flex-shrink: 0;
    overflow-x: auto;
  }

  .user-info-bar::-webkit-scrollbar { display: none; }

  .info-tag {
    font-size: 11px;
    white-space: nowrap;
    color: var(--text2);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .info-tag span {
    color: var(--accent);
    font-weight: 700;
  }

  /* ========== MODAL ========== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    backdrop-filter: blur(4px);
    padding: 1rem;
  }

  .modal-overlay.show {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2rem;
    width: 100%;
    max-width: 400px;
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal-title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 1.4rem;
    margin-bottom: 1.5rem;
    color: var(--accent);
  }

  .modal-section {
    margin-bottom: 1.5rem;
  }

  .modal-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--text2);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .modal-btns {
    display: flex;
    gap: 10px;
    margin-top: 1.5rem;
  }

  .btn-cancel {
    flex: 1;
    padding: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text2);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-cancel:hover { background: rgba(255,255,255,0.08); }

  .btn-save {
    flex: 2;
    padding: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 10px;
    color: white;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 15px rgba(255,59,59,0.3);
  }

  .btn-save:hover {
    box-shadow: 0 4px 20px rgba(255,59,59,0.5);
    transform: translateY(-1px);
  }

  /* QR Modal */
  #qrModal .modal {
    text-align: center;
  }

  #qrcode {
    display: inline-block;
    background: white;
    padding: 16px;
    border-radius: 12px;
    margin: 1rem 0;
  }

  .qr-url {
    font-size: 11px;
    color: var(--text2);
    word-break: break-all;
    background: rgba(255,255,255,0.04);
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    margin-top: 1rem;
  }

  /* ========== LOADING ========== */
  .typing-bubble {
    display: flex;
    gap: 4px;
    padding: 14px 18px;
    align-items: center;
  }

  /* ========== QUICK REPLIES ========== */
  .quick-replies {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 20px 12px;
  }

  .quick-reply {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12px;
    color: var(--text2);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    font-family: 'Noto Sans KR', sans-serif;
  }

  .quick-reply:hover {
    background: rgba(255,59,59,0.1);
    border-color: rgba(255,59,59,0.3);
    color: var(--accent);
  }

  /* Scrollbar for modal */
  .modal::-webkit-scrollbar { width: 4px; }
  .modal::-webkit-scrollbar-track { background: transparent; }
  .modal::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

  /* Responsive */
  @media (max-width: 480px) {
    .intro-form { padding: 1.5rem; }
    .grades-grid { grid-template-columns: 1fr 1fr; }
    .msg { max-width: 92%; }
  }
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="bg-glow2"></div>

<!-- ========== INTRO SCREEN ========== -->
<div class="screen" id="introScreen">
  <div class="intro-badge">⚠ 공부 강제 각성 시스템</div>
  <h1 class="intro-title">공부해<br>임마</h1>
  <p class="intro-sub">핸드폰 잠깐 내려놓고 현실 좀 직시하자</p>

  <div class="intro-form">
    <div class="form-title">📋 나의 정보 입력</div>

    <div class="form-group">
      <label>이름</label>
      <input type="text" id="inputName" placeholder="이름을 입력하세요" maxlength="20">
    </div>

    <div class="form-group">
      <label>학년</label>
      <select id="inputGrade">
        <option value="">학년 선택</option>
        <option value="중1">중학교 1학년</option>
        <option value="중2">중학교 2학년</option>
        <option value="중3">중학교 3학년</option>
        <option value="고1">고등학교 1학년</option>
        <option value="고2">고등학교 2학년</option>
        <option value="고3">고등학교 3학년</option>
      </select>
    </div>

    <div class="form-group">
      <label>주요 과목 성적 (선택)</label>
      <div class="grades-grid">
        <div class="grade-item">
          <label>국어</label>
          <input type="text" id="gradeKorean" placeholder="예: 80점 / 3등급">
        </div>
        <div class="grade-item">
          <label>수학</label>
          <input type="text" id="gradeMath" placeholder="예: 70점 / 4등급">
        </div>
        <div class="grade-item">
          <label>영어</label>
          <input type="text" id="gradeEnglish" placeholder="예: 75점 / 3등급">
        </div>
        <div class="grade-item">
          <label>탐구</label>
          <input type="text" id="gradeScience" placeholder="예: 85점 / 2등급">
        </div>
      </div>
    </div>

    <div class="form-group">
      <label>전체 석차 / 목표 (선택)</label>
      <input type="text" id="inputRank" placeholder="예: 30/100명, 목표: 수능 2등급">
    </div>

    <button class="btn-start" onclick="startApp()">🔥 나를 각성시켜줘</button>
  </div>
</div>

<!-- ========== MAIN SCREEN ========== -->
<div class="screen hidden" id="mainScreen">
  <div class="header">
    <div class="header-logo">공부해 임마</div>
    <div class="header-info">
      <div class="status-badge status-active">🔥 팩폭 모드</div>
    </div>
    <div class="header-btns">
      <button class="icon-btn" onclick="showQR()">📱 QR</button>
    </div>
  </div>

  <div class="user-info-bar" id="userInfoBar">
    <div class="info-tag">👤 <span id="displayName">-</span></div>
    <div class="info-tag">📚 <span id="displayGrade">-</span></div>
    <div class="info-tag">📊 국어: <span id="displayKorean">-</span></div>
    <div class="info-tag">➕ 수학: <span id="displayMath">-</span></div>
    <div class="info-tag">🌍 영어: <span id="displayEnglish">-</span></div>
    <div class="info-tag">🔬 탐구: <span id="displayScience">-</span></div>
    <div class="info-tag">🏆 석차: <span id="displayRank">-</span></div>
  </div>

  <div class="chat-container" id="chatContainer"></div>

  <div class="quick-replies" id="quickReplies">
    <button class="quick-reply" onclick="sendQuick('나 지금 공부하기 싫어')">😩 공부하기 싫어</button>
    <button class="quick-reply" onclick="sendQuick('조금만 더 쉬고 할게')">😅 조금만 더 쉬고</button>
    <button class="quick-reply" onclick="sendQuick('유튜브 하나만 보고 할게')">▶️ 유튜브 하나만</button>
    <button class="quick-reply" onclick="sendQuick('동기부여 해줘')">🔥 동기부여 해줘</button>
  </div>

  <div class="input-area">
    <textarea class="chat-input" id="chatInput" placeholder="메시지를 입력하세요..." rows="1"
      onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" onclick="sendMessage()">↑</button>
  </div>
</div>

<!-- ========== QR MODAL ========== -->
<div class="modal-overlay" id="qrModal">
  <div class="modal">
    <div class="modal-title">📱 QR 코드</div>
    <p style="font-size: 13px; color: var(--text2); margin-bottom: 1rem;">친구에게도 공유해서 같이 각성하자!</p>
    <div id="qrcode"></div>
    <div class="qr-url" id="qrUrl"></div>
    <div class="modal-btns" style="margin-top: 1.5rem;">
      <button class="btn-cancel" onclick="closeModal('qrModal')" style="flex: 1;">닫기</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// STATE
// ============================================================
let userData = {};
let conversationHistory = [];
let qrGenerated = false;

// ============================================================
// START APP
// ============================================================
function startApp() {
  const name = document.getElementById('inputName').value.trim();
  const grade = document.getElementById('inputGrade').value;

  if (!name) { alert('이름을 입력해주세요!'); return; }
  if (!grade) { alert('학년을 선택해주세요!'); return; }

  userData = {
    name,
    grade,
    korean: document.getElementById('gradeKorean').value.trim() || '미입력',
    math: document.getElementById('gradeMath').value.trim() || '미입력',
    english: document.getElementById('gradeEnglish').value.trim() || '미입력',
    science: document.getElementById('gradeScience').value.trim() || '미입력',
    rank: document.getElementById('inputRank').value.trim() || '미입력'
  };

  document.getElementById('displayName').textContent = userData.name;
  document.getElementById('displayGrade').textContent = userData.grade;
  document.getElementById('displayKorean').textContent = userData.korean;
  document.getElementById('displayMath').textContent = userData.math;
  document.getElementById('displayEnglish').textContent = userData.english;
  document.getElementById('displayScience').textContent = userData.science;
  document.getElementById('displayRank').textContent = userData.rank;

  document.getElementById('introScreen').classList.add('hidden');
  document.getElementById('mainScreen').classList.remove('hidden');

  setTimeout(() => {
    sendWelcome();
  }, 500);
}

// ============================================================
// SEND WELCOME
// ============================================================
async function sendWelcome() {
  const systemContext = buildSystemPrompt();

  const welcomePrompt = `사용자가 방금 앱에 접속했습니다. 
사용자 정보:
- 이름: ${userData.name}
- 학년: ${userData.grade}
- 국어: ${userData.korean}
- 수학: ${userData.math}  
- 영어: ${userData.english}
- 탐구: ${userData.science}
- 석차/목표: ${userData.rank}

이 사용자에게 첫 인사를 해주세요. 이름을 불러주고, 성적을 언급하며 직설적으로 팩트 폭격을 날려주세요.`;

  addMessage('ai', '...', false, true);
  await fetchAI(welcomePrompt, systemContext, true);
}

// ============================================================
// SYSTEM PROMPT
// ============================================================
function buildSystemPrompt() {
  const gradeInfo = `
사용자 성적 정보:
- 이름: ${userData.name} (${userData.grade})
- 국어: ${userData.korean}
- 수학: ${userData.math}
- 영어: ${userData.english}
- 탐구: ${userData.science}
- 석차/목표: ${userData.rank}`;

  return `당신은 학생들이 스마트폰을 내려놓고 공부하게 만드는 AI입니다. 항상 '팩트 폭격 모드'로 작동합니다.

${gradeInfo}

역할 지침:
- 학생의 성적과 현실을 직접적으로 언급하며 강하게 동기부여하세요.
- 말투는 솔직하고 직설적이며, 약간 공격적이어도 됩니다. (단, 욕설이나 폭언은 금지)
- "야", "너", "임마", "진짜로?", "정신 차려" 같은 직설적 표현을 사용해도 됩니다.
- 부모님 욕, 성적 발언, 심각한 모욕은 절대 하지 마세요.
- 사용자가 우울해질 정도로 심한 말은 피하고, 자존감을 아예 무너뜨리지는 마세요.
- 현실적 통계, 경쟁 상황, 미래 전망을 활용해 자극을 주세요.
- 변명하거나 반박하면 더 강한 팩트로 응수하세요.
- 궁극적 목표는 공부 동기 부여이므로, 마지막엔 격려나 구체적 행동 제시로 마무리하세요.
- 200자 이내로 간결하게 답하세요.
- 한국어로만 답하세요.`;
}

// ============================================================
// FETCH AI
// ============================================================
async function fetchAI(userMsg, systemPrompt, isWelcome = false) {
  try {
    if (!isWelcome) {
      conversationHistory.push({ role: 'user', content: userMsg });
    }

    const messages = isWelcome
      ? [{ role: 'user', content: userMsg }]
      : conversationHistory.slice(-10);

    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: systemPrompt,
        messages
      })
    });

    const data = await response.json();
    const reply = data.content?.[0]?.text || '응답을 받지 못했어요.';

    removeTyping();
    addMessage('ai', reply, true);

    if (!isWelcome) {
      conversationHistory.push({ role: 'assistant', content: reply });
    }
  } catch (e) {
    removeTyping();
    addMessage('ai', '연결에 문제가 생겼어. 잠깐 후에 다시 시도해봐.', false);
    console.error(e);
  }
}

// ============================================================
// MESSAGES
// ============================================================
function addMessage(role, text, angry = false, isTyping = false) {
  const container = document.getElementById('chatContainer');

  const msg = document.createElement('div');
  msg.className = `msg ${role}${angry ? ' angry' : ''}`;
  if (isTyping) msg.id = 'typingMsg';

  const avatar = document.createElement('div');
  avatar.className = `msg-avatar ${role}`;
  avatar.textContent = role === 'ai' ? '👊' : '👤';

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';

  if (isTyping) {
    bubble.innerHTML = `<div class="typing-bubble">
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
    </div>`;
  } else {
    bubble.textContent = text;
  }

  msg.appendChild(avatar);
  msg.appendChild(bubble);
  container.appendChild(msg);
  container.scrollTop = container.scrollHeight;

  return msg;
}

function removeTyping() {
  const typing = document.getElementById('typingMsg');
  if (typing) typing.remove();
}

// ============================================================
// SEND MESSAGE
// ============================================================
async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  autoResize(input);

  addMessage('user', text);
  addMessage('ai', '...', false, true);

  const system = buildSystemPrompt();
  await fetchAI(text, system);
}

function sendQuick(text) {
  document.getElementById('chatInput').value = text;
  sendMessage();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ============================================================
// QR CODE
// ============================================================
function showQR() {
  const url = window.location.href;
  document.getElementById('qrUrl').textContent = url;

  if (!qrGenerated) {
    document.getElementById('qrcode').innerHTML = '';
    new QRCode(document.getElementById('qrcode'), {
      text: url,
      width: 200,
      height: 200,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });
    qrGenerated = true;
  }

  document.getElementById('qrModal').classList.add('show');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}

// Close modal on overlay click
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', function(e) {
    if (e.target === this) closeModal(this.id);
  });
});
</script>
</body>
</html>
